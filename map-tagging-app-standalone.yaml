          # aws-marketplace:ViewSubscriptions and aws-marketplace:Subscribe do not support
          # resource-level ARN restrictions — Resource: "*" is the only valid value.
          # Ref: https://docs.aws.amazon.com/bedrock/latest/userguide/model-access-permissions.html
          #
          # Compensating controls:
          #   1. aws:RequestedRegion condition restricts to the stack deployment region only
