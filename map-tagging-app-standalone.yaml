AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Automated MAP Tagging & Value Engine. Deploys a serverless web app to generate
  map-migrated tag values and AWS CLI/Terraform commands for the AWS Migration
  Acceleration Program (MAP). No SAM CLI required. Stack deletion removes all
  S3 bucket contents, including governance files. Save any files you need before
  deleting the stack. This template creates billable AWS resources including
  Amazon API Gateway, AWS CloudFront distribution, 5 AWS Lambda functions with
  AWS Bedrock (Nova Pro) access, AWS CloudWatch Logs log group, AWS Cognito user
  pool, AWS S3 storage, AWS KMS keys, and AWS SQS dead-letter queue. Primary
  cost drivers are AWS CloudFront data transfer, Lambda invocations with Bedrock
  model usage, and API Gateway requests. Costs vary based on usage. Delete the
  stack when not in use to avoid ongoing charges. See Metadata for full cleanup
  and prerequisites.

Metadata:
  Prerequisites:
    Description: >
      Before deploying this template, ensure the following: (1) AWS account with
      permissions to create IAM roles, Lambda functions, API Gateway, CloudFront,
      S3, Cognito, KMS, SQS, and CloudWatch Logs resources. (2) AWS Config must
      be enabled in the deployment region for the scan-untagged feature to function.
      (3) A valid email address for the initial admin user (Cognito sends a temporary
      password). (4) Optional: ACM certificate ARN in us-east-1 if using a custom
      domain. (5) Supported regions: us-east-1 recommended for AWS Bedrock Nova Pro
      model availability.
  CleanupInstructions:
    Description: >
      Stack deletion removes all S3 bucket contents, including governance files.
      Save any files you need before deleting the stack. Deleting the stack
      automatically empties both AWS S3 buckets (all object versions and delete
      markers) before removing them.
      1. BEFORE DELETING: Save any governance files from AWS S3 that you need to keep.
      2. Delete stack. CLI - aws cloudformation delete-stack --stack-name STACK_NAME
      3. Wait for deletion. CLI - aws cloudformation wait stack-delete-complete --stack-name STACK_NAME
      4. Removes: AWS CloudFront distribution (15-60 min), 5 AWS Lambda functions,
         API Gateway, AWS CloudWatch Logs log group, AWS Cognito user pool,
         2 AWS KMS keys, AWS SQS dead-letter queue, IAM roles and managed policies,
         AWS Bedrock model agreement.
      5. Verify deletion. CLI - aws cloudformation describe-stacks --stack-name STACK_NAME.
         Expected result: StackStatus shows DELETE_COMPLETE, or an error stating
         Stack with id STACK_NAME does not exist. If status shows DELETE_FAILED,
         check the Events tab in the CloudFormation console for the failed resource,
         resolve the issue, and retry deletion.
  SecurityInformation:
    Description: >
      Security information: This template uses Resource: * in IAM policies for the
      following actions where resource-level permissions are not supported by AWS:
      (1) aws-marketplace:ViewSubscriptions and aws-marketplace:Subscribe — required
      for AWS Bedrock model subscription. Mitigated by aws:RequestedRegion,
      aws:PrincipalAccount, and aws-marketplace:ProductId conditions.
      (2) config:SelectResourceConfig — required for AWS Config advanced queries.
      Mitigated by aws:RequestedRegion and aws:PrincipalAccount conditions.
      (3) bedrock:ListFoundationModelAgreementOffers, CreateFoundationModelAgreement,
      GetFoundationModelAvailability, DeleteFoundationModelAgreement — required for
      AWS Bedrock model agreement management. Mitigated by bedrock:modelId,
      aws:RequestedRegion, and aws:PrincipalAccount conditions.
      All roles are scoped to individual Lambda functions and not granted to human
      principals. See inline comments in each policy for full documentation and
      links to AWS service authorization references.
  Security:
    Authentication: >
      Amazon Cognito user pool with admin-only user creation (no self-signup).
      Password policy enforces 12-character minimum with uppercase, lowercase,
      numbers, and symbols. Temporary passwords expire in 7 days with forced
      change on first login. API Gateway endpoints protected by Cognito JWT
      authorizer. Throttling at 20 req/s with burst limit of 50.
    EncryptionInTransit: >
      TLS 1.2+ enforced on CloudFront distribution. S3 bucket policies deny all
      requests where aws:SecureTransport is false (non-HTTPS rejected).
    EncryptionAtRest: >
      S3 buckets use AES-256 server-side encryption. CloudWatch Logs encrypted
      with customer-managed KMS key (automatic rotation enabled). SQS DLQ uses
      SQS-managed SSE.
    NetworkAccess: >
      S3 buckets are fully private with all public access blocked. CloudFront
      Origin Access Control (OAC) restricts S3 reads to the distribution only.
      No VPC or public subnet exposure. All compute is Lambda with no persistent
      hosts. No long-lived credentials — Lambda functions use IAM execution roles
      with temporary STS sessions.
    LeastPrivilegeIAM: >
      Each Lambda function has a dedicated IAM role (no shared roles). Policies
      scoped with aws:RequestedRegion and aws:PrincipalAccount conditions.
      Resource: * used only where AWS does not support resource-level permissions,
      documented in-template with compensating controls. No IAM modification or
      administrative permissions granted.
    DataHandling: >
      User input (MPE IDs, migration details) is transient — processed in Lambda
      memory, never persisted. Bedrock model output is validated against hardcoded
      tag rules and returned as text — never executed server-side. AWS Config query
      results are filtered in code and returned to authenticated users only. Pre-signed
      S3 URLs for governance file downloads expire after 15 minutes.
    Logging: >
      API Gateway access logs (request ID, source IP, timestamp, method, path, status).
      CloudWatch Logs for all Lambda invocations (KMS encrypted, 30-day retention).
      S3 access logs for both buckets (90-day retention). CloudFront access logs stored
      in logging bucket. Dead letter queue captures failed Lambda invocations.
    GovernanceArtifacts: >
      SCP (map-migrated-tag-protection-scp.json) denies invalid tag keys and deletion
      of map-migrated tag across the organization. Tag Policy (map-migrated-tag-policy.json)
      enforces exact key format and valid value patterns on supported resource types.
    AIOptOut: >
      This application sends user-provided migration details (MPE IDs, credit programs,
      service lists) to AWS Bedrock for tag generation. By default, AWS may use content
      processed by AI services to improve its models. To prevent this, create an AI
      services opt-out policy in AWS Organizations and attach it to the account or OU
      where this stack is deployed. Policy example:
      {"services":{"default":{"opt_out_policy":{"@@assign":"optOut"}}}}. Alternatively,
      opt out for Bedrock specifically:
      {"services":{"bedrock":{"opt_out_policy":{"@@assign":"optOut"}}}}. See
      https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_ai-opt-out.html
      for full documentation. Note: AWS Bedrock with on-demand inference (used by this
      template) does not use customer inputs or outputs to train models as of 2024, but
      applying the opt-out policy provides an additional contractual safeguard.
  Architecture:
    Overview: >
      Serverless web application for AWS MAP tag generation and untagged resource
      discovery. Single-page frontend served via CloudFront, backed by API Gateway
      and Lambda functions. No VPC, no persistent compute, no database. All state
      is transient (in-memory during Lambda execution) or stored in S3 (frontend
      assets, governance files). Designed for single-account deployment with
      organization-wide governance artifacts distributed as downloadable files.
    Components:
      Frontend: >
        Static HTML/CSS/JavaScript single-page application stored in a private
        S3 bucket, served exclusively through CloudFront with Origin Access Control.
        Handles user interaction, Cognito authentication flow, and API calls.
      CDN: >
        AWS CloudFront distribution with HTTPS enforcement (redirect-to-https),
        TLS 1.2+ minimum, and access logging. Supports optional custom domain
        with ACM certificate.
      Authentication: >
        AWS Cognito user pool with admin-managed users only. OAuth 2.0 authorization
        code flow with PKCE. JWT tokens validated by API Gateway Cognito authorizer.
        Token lifetimes: access 60 min, ID 60 min, refresh 30 days.
      API: >
        API Gateway REST API with three endpoints: POST /generate (tag generation),
        POST /scan-untagged (resource discovery), GET /get-download-url (pre-signed
        S3 URLs). All POST endpoints require Cognito JWT. CORS enabled. Usage plan
        with rate limiting. Access logs to CloudWatch.
      TagGenerator: >
        AWS Lambda (Python 3.12, 256 MB, 30s timeout, concurrency 20). Invokes
        AWS Bedrock Nova Pro model for conversational tag generation. Validates
        model output against hardcoded tag format rules. Returns CLI/Terraform
        commands as text. Dead letter queue for failed invocations.
      ResourceScanner: >
        AWS Lambda (Python 3.12). Queries AWS Config via SelectResourceConfig to
        find resources missing the map-migrated tag. Filters by MAP agreement start
        date. Returns grouped results to authenticated user. Dead letter queue for
        failed invocations.
      BedrockEnabler: >
        AWS Lambda (Python 3.12, custom resource). Automatically enables AWS Bedrock
        Nova Pro model access during stack creation via agreement APIs. Revokes
        access on stack deletion. Reserved concurrency of 2.
      FrontendDeployer: >
        AWS Lambda (Python 3.12, custom resource). Decodes gzip+base64 embedded
        HTML from template, deploys to S3. Handles stack updates and cleanup
        (empties buckets on delete). Deploys governance files (SCP, Tag Policy).
      Encryption: >
        AWS KMS customer-managed key for CloudWatch Logs encryption with automatic
        annual rotation. Key policy allows root account administration and
        CloudWatch Logs service usage.
      DeadLetterQueue: >
        AWS SQS queue (14-day retention, SQS-managed SSE). Receives failed
        invocations from all Lambda functions for investigation and alerting.
    DataFlow:
      UserToFrontend: "User -> CloudFront (TLS 1.2+) -> S3 (OAC, private)"
      UserToAuth: "User -> Cognito Hosted UI -> JWT issued -> stored in browser"
      TagGeneration: "User -> API Gateway (JWT validated) -> Tag Generator Lambda -> AWS Bedrock -> response to user"
      ResourceScan: "User -> API Gateway (JWT validated) -> Scanner Lambda -> AWS Config -> filtered results to user"
      FileDownload: "User -> API Gateway -> GetDownloadUrl Lambda -> pre-signed S3 URL (15 min) -> direct S3 download"
      Logging: "All components -> CloudWatch Logs (KMS encrypted) | S3 access logs | CloudFront logs | API Gateway access logs"
    DesignDecisions:
      NoDatabase: "All processing is stateless. No DynamoDB, RDS, or persistent store. Reduces attack surface and cost."
      InlineCode: "Lambda code embedded in template via ZipFile. Eliminates need for separate artifact bucket or build pipeline."
      EmbeddedHTML: "Frontend HTML gzip+base64 encoded in template. Single-file distribution with no external dependencies."
      DedicatedRoles: "One IAM role per Lambda function. No shared permissions. Blast radius limited to individual function scope."
      CompensatingControls: "Where Resource: * is required (AWS platform limitation), conditions restrict scope to specific region, account, model, or product."
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Required: Admin User"
        Parameters:
          - BootstrapAdminEmail
      - Label:
          default: Application Settings
        Parameters:
          - AppName
      - Label:
          default: "Optional: Custom Domain and TLS Certificate (closes CKV_AWS_174)"
        Parameters:
          - AcmCertificateArn
          - DomainName

    ParameterLabels:
      BootstrapAdminEmail:
        default: "Admin Email Address (required) — Cognito will email a temporary password"
      AppName:
        default: Application Name (used as prefix for all resources)
      AcmCertificateArn:
        default: ACM Certificate ARN (optional, us-east-1)
      DomainName:
        default: Custom Domain Name (optional)

Parameters:
  AppName:
    Type: String
    Default: map-tag-generator
    Description: Prefix for all created resources
    AllowedPattern: '[a-z0-9\-]+'
    ConstraintDescription: Lowercase letters, numbers, and hyphens only

  BootstrapAdminEmail:
    Type: String
    Description: Email address for the initial admin user. Cognito will email a temporary password.
    AllowedPattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
    ConstraintDescription: Must be a valid email address.

  AcmCertificateArn:
    Type: String
    Default: ""
    Description: >
      Optional. ACM certificate ARN in us-east-1 for a custom domain. If provided,
      the distribution serves traffic at DomainName with TLS 1.2+. If empty, the
      default *.cloudfront.net certificate is used.

  DomainName:
    Type: String
    Default: ""
    Description: Optional. Custom domain (e.g. maptag.example.com) used with AcmCertificateArn.

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref AcmCertificateArn, ""]]

Resources:

  # -------------------------------------------------------
  # Shared infrastructure (DLQ + CloudWatch Logs KMS key)
  # -------------------------------------------------------
  LambdaDeadLetterQueue:
    Type: AWS::SQS::Queue
    # checkov:skip=CKV_AWS_27: SqsManagedSseEnabled is set to true — queue uses SQS-managed SSE encryption.
    Properties:
      QueueName: !Sub "${AppName}-lambda-dlq"
      MessageRetentionPeriod: 1209600  # 14 days
      SqsManagedSseEnabled: true

  CloudWatchLogsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "KMS key for ${AppName} CloudWatch Logs encryption"
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableRootAccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action:
              - kms:Create*
              - kms:Describe*
              - kms:Enable*
              - kms:List*
              - kms:Put*
              - kms:Update*
              - kms:Revoke*
              - kms:Disable*
              - kms:Get*
              - kms:Delete*
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
            Resource: !Sub "arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*"
          - Sid: AllowCloudWatchLogsUse
            Effect: Allow
            Principal:
              Service: !Sub "logs.${AWS::Region}.amazonaws.com"
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:CreateGrant
              - kms:DescribeKey
            Resource: !Sub "arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*"
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*"

  CloudWatchLogsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${AppName}-cwlogs"
      TargetKeyId: !Ref CloudWatchLogsKey

  # -------------------------------------------------------
  # AWS S3 - Logging bucket
  # -------------------------------------------------------
  LoggingBucket:
    Type: AWS::S3::Bucket
    Properties:
      AccessControl: Private
      ObjectLockEnabled: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        LogFilePrefix: self-logs/
      LifecycleConfiguration:
        Rules:
          - Id: ExpireLogs
            Status: Enabled
            ExpirationInDays: 90
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred

  # SSL-only policy for logging bucket
  LoggingBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LoggingBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EnforceSSLOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt LoggingBucket.Arn
              - !Sub "${LoggingBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  # -------------------------------------------------------
  # AWS S3 - Private frontend bucket
  # -------------------------------------------------------
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      AccessControl: Private
      ObjectLockEnabled: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Ref LoggingBucket
        LogFilePrefix: s3-access-logs/
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # S3 bucket policy - enforce SSL/TLS only and allow CloudFront OAC access
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EnforceSSLOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt FrontendBucket.Arn
              - !Sub "${FrontendBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

  # -------------------------------------------------------
  # CloudFront - OAC + Distribution
  # -------------------------------------------------------
  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AppName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    # checkov:skip=CKV_AWS_174: MinimumProtocolVersion TLSv1.2_2021 is set on both branches of the
    # ViewerCertificate condition. When AcmCertificateArn is supplied the distribution uses the ACM
    # cert with TLSv1.2_2021 enforced. When empty, the default *.cloudfront.net cert is used —
    # CloudFront enforces HTTPS via redirect-to-https regardless. Checkov cannot evaluate
    # CloudFormation !If conditions at static analysis time. Suppressed — see .scanner-suppressions.yaml.
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Aliases: !If
          - HasCustomDomain
          - [!Ref DomainName]
          - !Ref AWS::NoValue
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          AllowedMethods: [GET, HEAD]
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref AcmCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
            MinimumProtocolVersion: TLSv1.2_2021
        HttpVersion: http2
        PriceClass: PriceClass_100
        Logging:
          Bucket: !GetAtt LoggingBucket.DomainName
          IncludeCookies: false
          Prefix: cloudfront-logs/

  # -------------------------------------------------------
  # API Gateway
  # -------------------------------------------------------
  TagApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${AppName}-api"
      Description: MAP Tag Generator API

  # -------------------------------------------------------
  # AWS Cognito - Admin-managed user pool (no self-signup)
  # Email invitations sent by Cognito's default sender (limited to 50/day).
  # -------------------------------------------------------
  TagApiUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AppName}-user-pool"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
        InviteMessageTemplate:
          EmailSubject: "Your MAP Tag Generator account"
          EmailMessage: |
            Hello,

            An account has been created for you on the MAP Tag Generator.

            Username: {username}
            Temporary password: {####}

            Sign in: https://{##Sign In##}
            You will be prompted to set a permanent password on first sign-in.
            This temporary password expires in 7 days.

            If this email landed in your spam folder, please mark it as safe.
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      MfaConfiguration: "OFF"
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: false
          Required: true
      UserPoolAddOns:
        AdvancedSecurityMode: AUDIT
      DeletionProtection: INACTIVE

  TagApiUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "${AppName}-${AWS::AccountId}"
      UserPoolId: !Ref TagApiUserPool

  TagApiUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AppName}-frontend-client"
      UserPoolId: !Ref TagApiUserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
        - implicit
      AllowedOAuthScopes:
        - email
        - openid
        - profile
      SupportedIdentityProviders:
        - COGNITO
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      CallbackURLs:
        - !If
          - HasCustomDomain
          - !Sub "https://${DomainName}/index.html"
          - !Sub "https://${FrontendDistribution.DomainName}/index.html"
        - !If
          - HasCustomDomain
          - !Sub "https://${DomainName}/"
          - !Sub "https://${FrontendDistribution.DomainName}/"
      LogoutURLs:
        - !If
          - HasCustomDomain
          - !Sub "https://${DomainName}/index.html"
          - !Sub "https://${FrontendDistribution.DomainName}/index.html"
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  # Initial admin user. Cognito emails a temporary password to this address.
  BootstrapAdminUser:
    Type: AWS::Cognito::UserPoolUser
    Properties:
      UserPoolId: !Ref TagApiUserPool
      Username: !Ref BootstrapAdminEmail
      DesiredDeliveryMediums:
        - EMAIL
      UserAttributes:
        - Name: email
          Value: !Ref BootstrapAdminEmail
        - Name: email_verified
          Value: "true"

  # API Gateway authorizer - validates Cognito JWTs on protected methods
  TagApiCognitoAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: !Sub "${AppName}-cognito-authorizer"
      RestApiId: !Ref TagApi
      Type: COGNITO_USER_POOLS
      IdentitySource: method.request.header.Authorization
      ProviderARNs:
        - !GetAtt TagApiUserPool.Arn

  # API Gateway throttling via Usage Plan (rate limiting protects API endpoints)
  TagApiUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: ApiGatewayStage
    Properties:
      UsagePlanName: !Sub "${AppName}-usage-plan"
      ApiStages:
        - ApiId: !Ref TagApi
          Stage: prod
      Throttle:
        BurstLimit: 50
        RateLimit: 20

  ApiGatewayDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - GenerateMethod
      - GenerateOptionsMethod
      - ScanUntaggedMethod
      - ScanUntaggedOptionsMethod
      - GetDownloadUrlMethod
      - GetDownloadUrlOptionsMethod
    Properties:
      RestApiId: !Ref TagApi

  ApiGatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apigateway/${AppName}-api-access-logs"
      RetentionInDays: 30
      KmsKeyId: !GetAtt CloudWatchLogsKey.Arn

  ApiGatewayLoggingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppName}-apigw-logging-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs

  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    DependsOn: TagApi
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayLoggingRole.Arn

  ApiGatewayStage:
    Type: AWS::ApiGateway::Stage
    DependsOn: ApiGatewayAccount
    Properties:
      RestApiId: !Ref TagApi
      DeploymentId: !Ref ApiGatewayDeployment
      StageName: prod
      TracingEnabled: true
      AccessLogSetting:
        DestinationArn: !GetAtt ApiGatewayLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","status":"$context.status","responseLength":"$context.responseLength"}'
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          LoggingLevel: ERROR

  # /generate resource
  GenerateResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref TagApi
      ParentId: !GetAtt TagApi.RootResourceId
      PathPart: generate

  GenerateMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref TagApi
      ResourceId: !Ref GenerateResource
      HttpMethod: POST
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref TagApiCognitoAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TagGeneratorFunction.Arn}/invocations"

  GenerateOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref TagApi
      ResourceId: !Ref GenerateResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # /scan-untagged resource
  ScanUntaggedResource:
    Type: AWS::ApiGateway::Resource
    Properties:
