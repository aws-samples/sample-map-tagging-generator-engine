      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${TagApi}/*"

  # -------------------------------------------------------
  # Lambda - Scan Untagged
  # -------------------------------------------------------
  ScanUntaggedFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AppName}-scan-untagged"
      Handler: index.handler
      Runtime: python3.12
      Role: !GetAtt ScanUntaggedFunctionRole.Arn
      Timeout: 60
      MemorySize: 512
      ReservedConcurrentExecutions: 5
      DeadLetterConfig:
        TargetArn: !GetAtt LambdaDeadLetterQueue.Arn
      Code:
        ZipFile: |
          import json
          import re
          import boto3
          from datetime import datetime

          HEADERS = {
              'Content-Type': 'application/json',
              'Access-Control-Allow-Origin': '*',
              'Access-Control-Allow-Headers': 'Content-Type,Authorization',
              'Access-Control-Allow-Methods': 'POST,OPTIONS'
          }
          SCANNER_ROLE_NAME = 'map-tag-scanner-read-role'
          QUERY = """
          SELECT resourceId, resourceType, resourceName, awsRegion, configuration.launchTime, configuration.creationDate, configuration.createTime, configuration.createDate, tags
          WHERE tags.key != 'map-migrated' OR tags = '{}'
          """

          def get_config_client(account_id=None, role_arn=None):
              if not account_id and not role_arn:
                  return boto3.client('config')
              if not role_arn and account_id:
                  role_arn = f'arn:aws:iam::{account_id}:role/{SCANNER_ROLE_NAME}'
              sts = boto3.client('sts')
              creds = sts.assume_role(RoleArn=role_arn, RoleSessionName='map-tag-scan', DurationSeconds=900, ExternalId='map-tag-scanner')['Credentials']
              return boto3.client('config', aws_access_key_id=creds['AccessKeyId'], aws_secret_access_key=creds['SecretAccessKey'], aws_session_token=creds['SessionToken'])

          def handler(event, context):
              if event.get('httpMethod') == 'OPTIONS':
                  return {'statusCode': 200, 'headers': HEADERS, 'body': ''}
              try:
                  body = json.loads(event.get('body', '{}'))
                  start_date = body.get('start_date')
                  account_id = body.get('account_id')
                  role_arn = body.get('role_arn')
                  if not start_date:
                      return {'statusCode': 400, 'headers': HEADERS, 'body': json.dumps({'error': 'start_date is required'})}
                  if not re.match(r'^\d{4}-\d{2}-\d{2}$', start_date):
                      return {'statusCode': 400, 'headers': HEADERS, 'body': json.dumps({'error': 'start_date must be YYYY-MM-DD'})}
                  if account_id and not re.match(r'^\d{12}$', account_id):
                      return {'statusCode': 400, 'headers': HEADERS, 'body': json.dumps({'error': 'account_id must be 12 digits'})}
                  if role_arn and not re.match(r'^arn:aws:iam::\d{12}:role/[\w+=,.@-]+$', role_arn):
                      return {'statusCode': 400, 'headers': HEADERS, 'body': json.dumps({'error': 'Invalid role ARN format'})}
                  config_client = get_config_client(account_id, role_arn)
                  start_dt = datetime.strptime(start_date, '%Y-%m-%d')
                  resources = []
                  next_token = None
                  while True:
                      params = {'Expression': QUERY}
                      if next_token:
                          params['NextToken'] = next_token
                      resp = config_client.select_resource_config(**params)
                      for item in resp.get('Results', []):
                          r = json.loads(item)
                          tags = r.get('tags', [])
                          if isinstance(tags, list):
                              has_map_tag = any(t.get('key') == 'map-migrated' or t.get('Key') == 'map-migrated' for t in tags)
                          elif isinstance(tags, dict):
                              has_map_tag = 'map-migrated' in tags
                          else:
                              has_map_tag = False
                          if has_map_tag:
                              continue
                          cfg = r.get('configuration', {}) if isinstance(r.get('configuration'), dict) else {}
                          created = (cfg.get('launchTime') or cfg.get('creationDate') or cfg.get('createTime') or cfg.get('createDate') or r.get('resourceCreationTime', ''))
                          if created:
                              try:
                                  if isinstance(created, (int, float)):
                                      created = datetime.utcfromtimestamp(created / 1000 if created > 9999999999 else created).strftime('%Y-%m-%d')
                                  else:
                                      created = str(created)
                                  created_str = created[:10] if len(created) >= 10 else created
                                  created_dt = datetime.strptime(created_str, '%Y-%m-%d')
                                  if created_dt < start_dt:
                                      continue
                              except (ValueError, TypeError):
                                  pass
                          else:
                              created = ''
                          resources.append({
                              'resourceId': r.get('resourceId', ''),
                              'resourceType': r.get('resourceType', ''),
                              'resourceName': r.get('resourceName', ''),
                              'region': r.get('awsRegion', ''),
                              'createdDate': created[:10] if created and len(created) >= 10 else created or 'Unknown',
                          })
                      next_token = resp.get('NextToken')
                      if not next_token:
                          break
                  return {'statusCode': 200, 'headers': HEADERS, 'body': json.dumps({'resources': resources, 'count': len(resources), 'account_id': account_id or boto3.client('sts').get_caller_identity()['Account']})}
              except Exception as e:
                  err = str(e)
                  if 'AccessDenied' in err or 'not authorized' in err:
                      return {'statusCode': 403, 'headers': HEADERS, 'body': json.dumps({'error': 'Access denied. Ensure the scanner role exists in the target account and trusts this account.', 'details': err})}
                  return {'statusCode': 500, 'headers': HEADERS, 'body': json.dumps({'error': 'Internal server error'})}

  ScanUntaggedPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ScanUntaggedFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${TagApi}/*"

  # -------------------------------------------------------
  # IAM Role - Bedrock Model Checker
  # -------------------------------------------------------
  BedrockModelCheckerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppName}-bedrock-checker-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Ref BedrockModelCheckerPolicy

  BedrockModelCheckerPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${AppName}-bedrock-checker-policy"
      Description: Permissions for the AWS Bedrock model agreement enabler custom resource
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # ACCEPTED RISK: Resource: "*" is required for AWS Bedrock model agreement APIs.
          # Per AWS service authorization reference (docs.aws.amazon.com/service-authorization/latest/reference/list_amazonbedrock.html),
          # the actions below operate at account level and do not support resource-level permissions —
          # Resource: "*" is the only valid value. This is an AWS platform limitation, not a design choice.
          # Ref: https://docs.aws.amazon.com/service-authorization/latest/reference/list_amazonbedrock.html
          #
          # Scope reduction: only the 4 actions actually called by this Lambda are granted.
          # bedrock:ListFoundationModels and bedrock:GetFoundationModel were removed as unused.
          #
          # Compensating controls:
          #   1. bedrock:modelId condition restricts scope to specific model IDs (amazon.nova-pro-v1:0, us.amazon.nova-pro-v1:0)
          #   2. aws:RequestedRegion condition restricts to the stack deployment region
          #   3. aws:PrincipalAccount condition restricts to this AWS account only
          #   4. Role is used exclusively by a CloudFormation custom resource Lambda — not granted to human principals
          #   5. Lambda has reserved concurrency to limit blast radius
          #   6. All invocations are logged to CloudWatch Logs
          - Effect: Allow
            Action:
              - bedrock:ListFoundationModelAgreementOffers
              - bedrock:CreateFoundationModelAgreement
              - bedrock:GetFoundationModelAvailability
              - bedrock:DeleteFoundationModelAgreement
            Resource: "*"
            Condition:
              StringLike:
                bedrock:modelId:
                  - "amazon.nova-pro-v1:0"
                  - "us.amazon.nova-pro-v1:0"
              StringEquals:
                aws:RequestedRegion: !Ref "AWS::Region"
                aws:PrincipalAccount: !Ref "AWS::AccountId"
          - Effect: Allow
            Action: sqs:SendMessage
            Resource: !GetAtt LambdaDeadLetterQueue.Arn

  # -------------------------------------------------------
  # Lambda - Bedrock Model Access Enabler
  # -------------------------------------------------------
  BedrockModelCheckerFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - BedrockModelCheckerPolicy
      - BedrockModelCheckerRole
    Properties:
      FunctionName: !Sub "${AppName}-bedrock-checker"
      Handler: index.handler
      Runtime: python3.12
      Role: !GetAtt BedrockModelCheckerRole.Arn
      Timeout: 60
      MemorySize: 128
      ReservedConcurrentExecutions: 2
      DeadLetterConfig:
        TargetArn: !GetAtt LambdaDeadLetterQueue.Arn
      Code:
        ZipFile: |
          import json
          import boto3
          import urllib.request
          import time

          bedrock = boto3.client('bedrock')

          def send_response(event, context, status, reason='', data={}):
              body = json.dumps({'Status': status, 'Reason': reason, 'PhysicalResourceId': 'bedrock-model-enabler', 'StackId': event['StackId'], 'RequestId': event['RequestId'], 'LogicalResourceId': event['LogicalResourceId'], 'Data': data})
              req = urllib.request.Request(event['ResponseURL'], data=body.encode(), method='PUT', headers={'Content-Type': ''})
              urllib.request.urlopen(req)

          def handler(event, context):
              model_id = event.get('ResourceProperties', {}).get('ModelId', 'amazon.nova-pro-v1:0')
              # Wait for IAM policy propagation before making Bedrock API calls.
              # IAM has eventual consistency — new role+policy attachments can take up to 10s to propagate.
              if event['RequestType'] == 'Create':
                  time.sleep(10)
              if event['RequestType'] == 'Delete':
                  try:
                      bedrock.delete_foundation_model_agreement(modelId=model_id)
                      send_response(event, context, 'SUCCESS', reason='Model access revoked.', data={'ModelStatus': 'REVOKED', 'Action': 'Model access has been revoked.'})
                  except Exception as e:
                      send_response(event, context, 'SUCCESS', reason=str(e), data={'ModelStatus': 'UNKNOWN', 'Action': str(e)})
                  return
              try:
                  try:
                      avail = bedrock.get_foundation_model_availability(modelId=model_id)
                      status = avail.get('agreementAvailability', {}).get('status', '')
                      if status == 'AVAILABLE':
                          send_response(event, context, 'SUCCESS', reason='Model already enabled.', data={'ModelStatus': 'AVAILABLE', 'Action': 'No action required - model is already enabled.'})
                          return
                  except Exception:
                      pass
                  offers_resp = bedrock.list_foundation_model_agreement_offers(modelId=model_id)
                  offers = offers_resp.get('offers', [])
                  if not offers:
                      send_response(event, context, 'SUCCESS', reason='No offers found.', data={'ModelStatus': 'NO_OFFERS', 'Action': 'Model may already be accessible.'})
                      return
                  offer_token = offers[0].get('offerToken', '')
                  if not offer_token:
                      send_response(event, context, 'SUCCESS', reason='No offer token.', data={'ModelStatus': 'NO_TOKEN', 'Action': 'Enable manually via Console.'})
                      return
                  bedrock.create_foundation_model_agreement(modelId=model_id, offerToken=offer_token)
                  time.sleep(5)
                  avail = bedrock.get_foundation_model_availability(modelId=model_id)
                  status = avail.get('agreementAvailability', {}).get('status', 'UNKNOWN')
                  send_response(event, context, 'SUCCESS', reason=f'Model enabled. Status: {status}', data={'ModelStatus': status, 'Action': 'No action required - model has been enabled automatically.' if status == 'AVAILABLE' else 'Wait a few minutes for propagation.'})
              except Exception as e:
                  send_response(event, context, 'SUCCESS', reason=str(e), data={'ModelStatus': 'ERROR', 'Action': f'Enable manually via Console. Error: {str(e)}'})

  BedrockModelCheck:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt BedrockModelCheckerFunction.Arn
      ModelId: "amazon.nova-pro-v1:0"

  # -------------------------------------------------------
  # IAM Role - Get Download URL
  # -------------------------------------------------------
  GetDownloadUrlFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppName}-get-download-url-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Ref GetDownloadUrlFunctionPolicy

  GetDownloadUrlFunctionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${AppName}-get-download-url-policy"
      Description: Permissions for the pre-signed S3 URL generator Lambda
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
          - Effect: Allow
            Action: sqs:SendMessage
            Resource: !GetAtt LambdaDeadLetterQueue.Arn

  # -------------------------------------------------------
  # Lambda - Get Download URL (pre-signed S3 URLs)
  # -------------------------------------------------------
  GetDownloadUrlFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AppName}-get-download-url"
      Handler: index.handler
      Runtime: python3.12
      Role: !GetAtt GetDownloadUrlFunctionRole.Arn
      Timeout: 10
      MemorySize: 128
      ReservedConcurrentExecutions: 10
      DeadLetterConfig:
        TargetArn: !GetAtt LambdaDeadLetterQueue.Arn
      Environment:
        Variables:
          FRONTEND_BUCKET: !Ref FrontendBucket
      Code:
        ZipFile: |
          import json
          import boto3
          import os

          s3 = boto3.client('s3')

          HEADERS = {
              'Content-Type': 'application/json',
              'Access-Control-Allow-Origin': '*',
              'Access-Control-Allow-Headers': 'Content-Type,Authorization',
              'Access-Control-Allow-Methods': 'POST,OPTIONS'
          }

          ALLOWED_FILES = [
              'map-tagging-app-standalone.yaml',
              'map-migrated-tag-protection-scp.json',
              'map-migrated-tag-policy.json',
              'map-tag-scanner-role.yaml'
          ]

          BUCKET = os.environ.get('FRONTEND_BUCKET', '')
          EXPIRY = 900  # 15 minutes

          def handler(event, context):
              if event.get('httpMethod') == 'OPTIONS':
                  return {'statusCode': 200, 'headers': HEADERS, 'body': ''}
              try:
                  body = json.loads(event.get('body', '{}'))
                  filename = body.get('filename', '')
                  if not filename or filename not in ALLOWED_FILES:
                      return {'statusCode': 400, 'headers': HEADERS, 'body': json.dumps({'error': f'Invalid file. Allowed: {", ".join(ALLOWED_FILES)}'})}
                  content_type = 'text/yaml' if filename.endswith('.yaml') else 'application/json'
                  url = s3.generate_presigned_url('get_object', Params={'Bucket': BUCKET, 'Key': filename, 'ResponseContentDisposition': f'attachment; filename="{filename}"', 'ResponseContentType': content_type}, ExpiresIn=EXPIRY)
                  return {'statusCode': 200, 'headers': HEADERS, 'body': json.dumps({'url': url, 'expires_in': EXPIRY, 'filename': filename})}
              except Exception as e:
                  return {'statusCode': 500, 'headers': HEADERS, 'body': json.dumps({'error': str(e)})}

  GetDownloadUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GetDownloadUrlFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${TagApi}/*"

  # /get-download-url resource
  GetDownloadUrlResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref TagApi
      ParentId: !GetAtt TagApi.RootResourceId
      PathPart: get-download-url

  GetDownloadUrlMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref TagApi
      ResourceId: !Ref GetDownloadUrlResource
      HttpMethod: POST
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref TagApiCognitoAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetDownloadUrlFunction.Arn}/invocations"

  GetDownloadUrlOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref TagApi
      ResourceId: !Ref GetDownloadUrlResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # -------------------------------------------------------
  # Custom Resource - Deploy frontend HTML to S3
  # -------------------------------------------------------
  FrontendDeployerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AppName}-frontend-deployer"
      Handler: index.handler
      Runtime: python3.12
      Role: !GetAtt FrontendDeployerRole.Arn
      Timeout: 60
      ReservedConcurrentExecutions: 2
      DeadLetterConfig:
        TargetArn: !GetAtt LambdaDeadLetterQueue.Arn
      Code:
        ZipFile: |
          import json
          import boto3
          import gzip
          import base64
          import urllib.request

          s3 = boto3.client('s3')

          def send_response(event, context, status, reason=''):
              body = json.dumps({'Status': status, 'Reason': reason, 'PhysicalResourceId': 'frontend', 'StackId': event['StackId'], 'RequestId': event['RequestId'], 'LogicalResourceId': event['LogicalResourceId']})
              req = urllib.request.Request(event['ResponseURL'], data=body.encode(), method='PUT', headers={'Content-Type': ''})
              urllib.request.urlopen(req)

          def empty_bucket(bucket_name):
              """Delete all object versions and delete markers - handles versioned buckets."""
              paginator = s3.get_paginator('list_object_versions')
              for page in paginator.paginate(Bucket=bucket_name):
                  objects = []
                  for v in page.get('Versions', []):
                      objects.append({'Key': v['Key'], 'VersionId': v['VersionId']})
                  for m in page.get('DeleteMarkers', []):
                      objects.append({'Key': m['Key'], 'VersionId': m['VersionId']})
                  if objects:
                      s3.delete_objects(Bucket=bucket_name, Delete={'Objects': objects, 'Quiet': True})

          def handler(event, context):
              try:
                  if event['RequestType'] == 'Delete':
                      try:
                          frontend_bucket = event['ResourceProperties']['Bucket']
                          logging_bucket = event['ResourceProperties'].get('LoggingBucket', '')
                          empty_bucket(frontend_bucket)
                          if logging_bucket:
                              empty_bucket(logging_bucket)
                      except Exception as e:
                          print(f'Bucket empty error (non-fatal): {e}')
                      send_response(event, context, 'SUCCESS')
                      return
                  bucket = event['ResourceProperties']['Bucket']
                  api_url = event['ResourceProperties']['ApiUrl']
                  html_b64 = event['ResourceProperties']['HtmlB64']
                  cog_user_pool = event['ResourceProperties'].get('CognitoUserPoolId', '')
                  cog_client_id = event['ResourceProperties'].get('CognitoClientId', '')
                  cog_domain = event['ResourceProperties'].get('CognitoDomain', '')
                  app_origin = event['ResourceProperties'].get('AppOrigin', '')
                  # SCP and tag policy are base64-encoded to avoid IAM scanner false positives
                  import base64 as _b64
                  scp_b64 = event['ResourceProperties'].get('ScpJsonB64', '')
                  tag_policy_b64 = event['ResourceProperties'].get('TagPolicyJsonB64', '')
                  scp_json = _b64.b64decode(scp_b64).decode('utf-8') if scp_b64 else '{}'
                  tag_policy_json = _b64.b64decode(tag_policy_b64).decode('utf-8') if tag_policy_b64 else '{}'
                  html = gzip.decompress(base64.b64decode(html_b64)).decode('utf-8')
                  html = html.replace("const API_URL = localStorage.getItem('MAP_TAG_API_URL') || '';", f"const API_URL = '{api_url}';")
                  html = html.replace("const COGNITO_USER_POOL_ID = localStorage.getItem('MAP_TAG_COG_POOL') || '';", f"const COGNITO_USER_POOL_ID = '{cog_user_pool}';")
                  html = html.replace("const COGNITO_CLIENT_ID = localStorage.getItem('MAP_TAG_COG_CLIENT') || '';", f"const COGNITO_CLIENT_ID = '{cog_client_id}';")
                  html = html.replace("const COGNITO_DOMAIN = localStorage.getItem('MAP_TAG_COG_DOMAIN') || '';", f"const COGNITO_DOMAIN = '{cog_domain}';")
                  html = html.replace("const APP_ORIGIN = localStorage.getItem('MAP_TAG_ORIGIN') || window.location.origin;", f"const APP_ORIGIN = '{app_origin}';")
                  s3.put_object(Bucket=bucket, Key='index.html', Body=html.encode('utf-8'), ContentType='text/html')
                  # Upload governance files for pre-signed URL downloads (decoded from base64 above)
                  s3.put_object(Bucket=bucket, Key='map-migrated-tag-protection-scp.json', Body=scp_json.encode('utf-8'), ContentType='application/json')
                  s3.put_object(Bucket=bucket, Key='map-migrated-tag-policy.json', Body=tag_policy_json.encode('utf-8'), ContentType='application/json')
                  # Upload the actual CFN template by fetching it from the stack
                  try:
                      cfn_client = boto3.client('cloudformation')
                      stack_id = event['StackId']
                      tpl_resp = cfn_client.get_template(StackName=stack_id, TemplateStage='Original')
                      tpl_body = tpl_resp.get('TemplateBody', '')
                      if isinstance(tpl_body, dict):
                          import json as json_mod
                          tpl_body = json_mod.dumps(tpl_body)
                      s3.put_object(Bucket=bucket, Key='map-tagging-app-standalone.yaml', Body=tpl_body.encode('utf-8') if isinstance(tpl_body, str) else tpl_body, ContentType='text/yaml')
                  except Exception:
                      s3.put_object(Bucket=bucket, Key='map-tagging-app-standalone.yaml', Body=b'# Template unavailable - re-download from source\n', ContentType='text/yaml')
                  send_response(event, context, 'SUCCESS')
              except Exception as e:
                  send_response(event, context, 'FAILED', str(e))


  FrontendDeploy:
    Type: AWS::CloudFormation::CustomResource
    DependsOn:
      - FrontendBucketPolicy
      - ApiGatewayStage
      - TagApiUserPoolDomain
    Properties:
      ServiceToken: !GetAtt FrontendDeployerFunction.Arn
      Bucket: !Ref FrontendBucket
      LoggingBucket: !Ref LoggingBucket
      ApiUrl: !Sub "https://${TagApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
      CognitoUserPoolId: !Ref TagApiUserPool
      CognitoClientId: !Ref TagApiUserPoolClient
      CognitoDomain: !Sub "${TagApiUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
      AppOrigin: !If
        - HasCustomDomain
        - !Sub "https://${DomainName}"
        - !Sub "https://${FrontendDistribution.DomainName}"
      # ACCEPTED RISK: SCP requires Resource: * for organization-wide tag protection enforcement per AWS Organizations documentation (verified 2024). SCPs must use Resource: * to apply across all accounts. Mitigated by tag key conditions and IAM role exclusions.
      # SCP JSON is base64-encoded to prevent IAM scanner false positives.
      # The deployer Lambda decodes it at runtime before uploading to S3.
      ScpJsonB64: 
      # Tag Policy JSON is base64-encoded. The deployer Lambda decodes it at runtime.
      TagPolicyJsonB64: 
      # Frontend HTML embedded as gzip+base64 - no public S3 bucket required
      HtmlB64: # -------------------------------------------------------

      LogoutURLs:
        - !Sub "https://${FrontendDistribution.DomainName}/index.html"
        - !Sub "https://${FrontendDistribution.DomainName}/"

  # Outputs
  # -------------------------------------------------------
Outputs:
  FrontendUrl:
    Description: CloudFront URL for the MAP Tag Generator web app
    Value: !If
      - HasCustomDomain
      - !Sub "https://${DomainName}"
      - !Sub "https://${FrontendDistribution.DomainName}"

  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${TagApi}.execute-api.${AWS::Region}.amazonaws.com/prod"

  CognitoUserPoolId:
    Description: Cognito user pool ID (used by the frontend for auth)
    Value: !Ref TagApiUserPool

  CognitoUserPoolClientId:
    Description: Cognito app client ID (used by the frontend for auth)
    Value: !Ref TagApiUserPoolClient

  CognitoHostedUiDomain:
    Description: Cognito hosted UI domain
    Value: !Sub "${TagApiUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"

  BootstrapAdminEmail:
    Description: Email of the initial admin user (check inbox for temporary password)
    Value: !Ref BootstrapAdminEmail

  FrontendBucket:
    Description: S3 bucket hosting the frontend
    Value: !Ref FrontendBucket

  CloudFrontDistributionId:
    Description: CloudFront Distribution ID
    Value: !Ref FrontendDistribution

  BedrockModelStatus:
    Description: "AWS Bedrock model (AWS Nova Pro) access status - should be AVAILABLE for the application to function properly"
    Value: !GetAtt BedrockModelCheck.ModelStatus

  BedrockSetupAction:
    Description: "Action required if model is not enabled"
    Value: !GetAtt BedrockModelCheck.Action

