  ScanUntaggedFunctionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Permissions for the untagged-resource scanner AWS Lambda (AWS Config query + cross-account AssumeRole + Org listing + DLQ)
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # ACCEPTED RISK: Resource: "*" is required for config:SelectResourceConfig.
          # Per the AWS Config service authorization reference
          # (docs.aws.amazon.com/service-authorization/latest/reference/list_awsconfig.html),
          # SelectResourceConfig is an advanced query API that operates across all resource types
          # in an account. It does not support resource-level IAM permissions — Resource: "*"
          # is the only valid value. This is an AWS platform limitation, not a design choice.
          # Ref: https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsconfig.html
          #
          # Compensating controls:
          #   1. aws:RequestedRegion condition restricts queries to the stack deployment region only
          #   2. aws:PrincipalAccount condition restricts to this AWS account only
          #   3. The Lambda function code filters results by MAP agreement start date and
          #      tag presence before returning data — query scope is further limited in code
          #   4. Role is scoped to this single Lambda function — not granted to human principals
          #   5. All invocations are logged to AWS CloudWatch Logs
          - Effect: Allow
            Action: config:SelectResourceConfig
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref "AWS::Region"
                aws:PrincipalAccount: !Ref "AWS::AccountId"
          # Cross-account scanning via AssumeRole (targets must have map-tag-scanner-read-role)
          - Effect: Allow
            Action: sts:AssumeRole
            Resource: "arn:aws:iam::*:role/map-tag-scanner-read-role"
          - Effect: Allow
            Action: sts:GetCallerIdentity
            Resource: "*"
          - Effect: Allow
            Action: sqs:SendMessage
