  # -------------------------------------------------------
  # Lambda - Tag Generator
  # -------------------------------------------------------
  TagGeneratorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AppName}-function"
      Handler: index.handler
      Runtime: python3.12
      Role: !GetAtt TagGeneratorFunctionRole.Arn
      Timeout: 30
      MemorySize: 256
      ReservedConcurrentExecutions: 20
      DeadLetterConfig:
        TargetArn: !GetAtt LambdaDeadLetterQueue.Arn
      Code:
        ZipFile: |
          import json,re,boto3
          br=boto3.client('bedrock-runtime')
          TR={("General Migration",None,None):"mig{m}",("SAP",None,None):"sap{m}",("Oracle",None,None):"oracle{m}",("DB&A","On-premises Commercial DB&A","Any AWS DB&A Service"):"comm{m}",("DB&A","On-premises non-commercial DB&A","Any AWS DB&A Service"):"mig{m}",("DB&A","On-premises Commercial DB&A","EC2"):"mig{m}",("DB&A","On-premises non-commercial DB&A","EC2"):"mig{m}",("DB&A","EC2 Commercial DB&A","Any AWS DB&A Service"):"comm_ec2_{m}",("DB&A","EC2 non-commercial DB&A","Any AWS DB&A Service"):"mig_ec2_{m}"}
          VS=["ec2","lambda","ecs","eks","lightsail","beanstalk","s3","ebs","efs","fsx","rds","dynamodb","elasticache","redshift","docdb","neptune","vpc","elb","cloudfront","apigw","route53","emr","kinesis","glue","opensearch","kms","secretsmanager","acm","sqs","sns","stepfunctions","eventbridge","bedrock","sagemaker","comprehend","kendra","workspaces","appstream","gamelift","backup","datasync","storagegateway","dax","keyspaces","timestream","memorydb","transitgateway","networkfirewall","vpclattice","codebuild","codepipeline","mq","msk","dms","transfer","athena","quick-sight","iot","iotsitewise"]
          SP="You are an AWS MAP tagging assistant. Have a friendly conversation to collect these details ONE question at a time: 1)MPE ID (exactly 10 uppercase alphanumeric chars like F7TZW2LR76) 2)Credit Program: General Migration, SAP, Oracle, or DB&A 3)For DB&A only: Source and Destination 4)Which AWS services to tag - ask which services, user will pick from a list 5)Output format: AWS CLI or Terraform. Tag value rules: General Migration=mig{MPE_ID}, SAP=sap{MPE_ID}, Oracle=oracle{MPE_ID}, DB&A On-prem Commercial to Any AWS DB&A=comm{MPE_ID}, DB&A On-prem Non-commercial to Any AWS DB&A=mig{MPE_ID}, DB&A EC2 Commercial to Any AWS DB&A=comm_ec2_{MPE_ID}, DB&A EC2 Non-commercial to Any AWS DB&A=mig_ec2_{MPE_ID}. IMPORTANT: Do NOT re-ask for information already provided. When you have ALL details, respond with ONLY this JSON (no other text): {\"complete\":true,\"mpe_id\":\"...\",\"credit_program\":\"...\",\"source\":null,\"destination\":null,\"services\":[\"ec2\",\"rds\"],\"output_format\":\"cli\",\"tag_value\":\"...\"}"
          SC="You are an AWS MAP tagging assistant. The user provided a pre-filled prompt with MPE ID and credit program already included. Extract those from the prompt - do NOT ask for them again. You only need to collect: 1)Which AWS services to tag 2)Output format: cli or terraform. Do NOT re-ask for services if already provided. When you have ALL details, respond with ONLY this JSON: {\"complete\":true,\"mpe_id\":\"...\",\"credit_program\":\"...\",\"source\":null,\"destination\":null,\"services\":[\"ec2\",\"rds\"],\"output_format\":\"cli\",\"tag_value\":\"...\"}"
          def nova(m,fp=False):
              r=br.invoke_model(modelId="us.amazon.nova-pro-v1:0",body=json.dumps({"system":[{"text":SC if fp else SP}],"messages":m,"inferenceConfig":{"max_new_tokens":512}}),contentType="application/json")
              return json.loads(r['body'].read())['output']['message']['content'][0]['text'].strip()
          def gtag(p):
              mpe,pg=p.get('mpe_id'),p.get('credit_program')
              if not mpe or not pg or not re.match(r'^[A-Z0-9]{10}$',mpe):return None
              k=(pg,p.get('source'),p.get('destination')) if pg=='DB&A' else (pg,None,None)
              t=TR.get(k)
              return t.format(m=mpe) if t else None
          def handler(event,context):
              H={'Content-Type':'application/json','Access-Control-Allow-Origin':'*','Access-Control-Allow-Headers':'Content-Type,Authorization','Access-Control-Allow-Methods':'POST,OPTIONS'}
              if event.get('httpMethod')=='OPTIONS':return{'statusCode':200,'headers':H,'body':''}
              try:
                  b=json.loads(event.get('body','{}'));ms=b.get('messages',[]);tx=b.get('text','')
                  if not ms and not tx:return{'statusCode':400,'headers':H,'body':json.dumps({'error':'No text'})}
                  nm=ms+[{"role":"user","content":[{"text":tx}]}] if tx else ms
                  if not nm:nm=[{"role":"user","content":[{"text":tx}]}]
                  rt=nova(nm,b.get('from_prompt',False))
                  s,e=rt.find('{'),rt.rfind('}')+1
                  if s>=0:
                      try:
                          p=json.loads(rt[s:e])
                          if p.get('complete'):
                              tv=p.get('tag_value') or gtag(p);sv=[x for x in(p.get('services')or[])if x in VS]
                              return{'statusCode':200,'headers':H,'body':json.dumps({'complete':True,'tag_value':tv,'parsed':p,'services':sv,'output_format':p.get('output_format','cli'),'nova_messages':nm+[{"role":"assistant","content":[{"text":rt}]}]})}
                      except:pass
                  return{'statusCode':200,'headers':H,'body':json.dumps({'complete':False,'message':rt,'nova_messages':nm+[{"role":"assistant","content":[{"text":rt}]}]})}
              except Exception as ex:
                  print(f"Error:{ex}");return{'statusCode':500,'headers':H,'body':json.dumps({'error':'Internal server error'})}

  TagGeneratorPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TagGeneratorFunction
      Action: lambda:InvokeFunction
